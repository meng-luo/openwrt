name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  # 从 release tag 构建，不是从滚动分支。
  # 分支 openwrt-25.12 的 include/version.mk 默认值是 25.12-SNAPSHOT，
  # 且 VERSION_REPO 会指向 releases/25.12-SNAPSHOT（滚动目录，apk 源会漂）。
  # tag 的 feeds.conf.default 还把 5 个 feed 钉死在具体 commit，可复现。
  REPO_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig

        # ---- defconfig 之后校验关键包没被静默丢弃 ----
        echo "=== 关键包在 defconfig 后的状态 ==="
        MISS=0
        for pk in kmod-sched-core kmod-sched-cake kmod-ifb tc-full sqm-scripts luci-app-sqm \
                  kmod-wireguard wireguard-tools luci-proto-wireguard \
                  kmod-tcp-bbr kmod-nft-offload kmod-nft-fullcone \
                  luci-app-passwall adguardhome luci-app-adguardhome dnsmasq-full \
                  miniupnpd-nftables luci-app-package-manager \
                  xray-core sing-box chinadns-ng geoview v2ray-plugin v2ray-geoip v2ray-geosite \
                  luci-theme-argon luci-app-ttyd luci-app-upnp \
                  nlbwmon luci-app-nlbwmon vnstat2 luci-app-vnstat2 netdata \
                  mtr-nojson speedtest-netperf ddns-go luci-app-ddns-go \
                  bash iftop conntrack lsof tcpdump iperf3 ethtool htop tmux socat drill \
                  qrencode smartmontools lscpu qemu-ga ip-full curl wget-ssl; do
          if grep -qx "CONFIG_PACKAGE_${pk}=y" .config; then
            echo "  OK    ${pk}"
          else
            echo "  MISS  ${pk}"; MISS=1
          fi
        done
        echo "=== 目标与架构 ==="
        grep -E '^CONFIG_TARGET_(x86|BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)' .config || true
        grep -E '^CONFIG_LINUX_' .config || true

        # ---- 构建基线：必须是从 release tag 构建，不能是滚动分支 ----
        # 这是本项目最容易悄悄跑偏的地方，判据必须确定性：
        #   分支的 version.mk 默认值是 "25.12-SNAPSHOT"
        #   分支的 feeds.conf.default 是 "git;openwrt-25.12"（滚动）
        #   tag  的 version.mk 默认值是 "25.12.2"
        #   tag  的 feeds.conf.default 是 "git^<40位commit>"（钉死）
        BMISS=0
        echo "=== 构建基线 ==="
        if grep -qE 'VERSION_NUMBER:=.*SNAPSHOT' openwrt/include/version.mk; then
          echo "  MISS  version.mk 版本默认值还是 SNAPSHOT —— 不是从 release tag 构建"
          grep -nE '^VERSION_NUMBER' openwrt/include/version.mk | sed 's/^/    /'
          BMISS=1
        else
          echo "  OK    version.mk 版本默认值不是 SNAPSHOT"
        fi
        grep -E '^VERSION_NUMBER:=.*[0-9]' openwrt/include/version.mk | sed 's/^/    /' | tail -2

        if grep -qE '^src-git [a-z]+ .*git;' openwrt/feeds.conf.default; then
          echo "  MISS  feeds.conf.default 指向滚动分支，应钉死 commit"
          sed 's/^/    /' openwrt/feeds.conf.default
          BMISS=1
        else
          echo "  OK    feeds 已钉死到具体 commit"
        fi
        if grep -qE '^src-git [a-z]+ .*git\^' openwrt/feeds.conf.default; then
          echo "  OK    5 个 feed 均为 ^commit 形式"
        else
          echo "  WARN  feeds 不是 ^commit 形式，确认一下"
        fi

        if grep -E '^CONFIG_VERSION_(NUMBER|REPO)=' .config | grep -q SNAPSHOT; then
          echo "  MISS  .config 里还残留 SNAPSHOT（会把 apk 源指向滚动目录）"
          grep -E '^CONFIG_VERSION_(NUMBER|REPO)=' .config | sed 's/^/    /'
          BMISS=1
        else
          echo "  OK    .config 里无 SNAPSHOT 残留"
        fi

        # 自编后缀：IMAGEOPT/VERSIONOPT 若被 kconfig 丢弃只 WARN —— 
        # tag 的 version.mk 默认值已是 25.12.2，正确性不依赖这几项。
        if grep -qE '^CONFIG_VERSION_NUMBER=' .config; then
          echo "  INFO  VERSION_NUMBER = $(grep '^CONFIG_VERSION_NUMBER=' .config | cut -d'"' -f2)"
          grep -E '^CONFIG_VERSION_REPO=' .config | sed 's/^/    /'
        else
          echo "  WARN  VERSIONOPT 未生效（非致命：tag 默认值已是 25.12.2）"
        fi

        # ---- 引导 / 镜像 / 编译优化：这些被静默重置会导致刷错镜像或优化失效 ----
        echo "=== 引导与镜像 ==="
        must() {
          if grep -qx "$1" .config; then echo "  OK    $1";
          else echo "  MISS  $1"; BMISS=1; fi
        }
        must 'CONFIG_GRUB_EFI_IMAGES=y'
        must 'CONFIG_TARGET_ROOTFS_EXT4FS=y'
        must 'CONFIG_TARGET_IMAGES_GZIP=y'
        must 'CONFIG_TARGET_KERNEL_PARTSIZE=128'
        must 'CONFIG_TARGET_ROOTFS_PARTSIZE=2048'
        must 'CONFIG_GRUB_TIMEOUT="5"'
        must 'CONFIG_DEVEL=y'
        must 'CONFIG_TARGET_OPTIONS=y'
        if grep -qx 'CONFIG_GRUB_IMAGES=y' .config; then
          echo "  WARN  同时选了 legacy GRUB_IMAGES（非致命，确认要 BIOS 镜像的话可留）"
        else
          echo "  OK    未选 GRUB_IMAGES（只出 EFI 镜像，符合 UEFI 机器）"
        fi

        echo "=== 编译优化（必须含 goldmont-plus，否则说明 DEVEL/TARGET_OPTIONS 没生效）==="
        grep -E '^CONFIG_TARGET_OPTIMIZATION=' .config || echo "  (未设置)"
        if ! grep -qE '^CONFIG_TARGET_OPTIMIZATION=".*goldmont-plus' .config; then
          echo "  MISS  编译优化被 kconfig 重置了（期望 goldmont-plus）"; BMISS=1
        else
          echo "  OK    goldmont-plus 优化已生效（J4125）"
        fi

        # ---- 必须「没有被选中」的包：上游某些 INCLUDE 默认值是 y ----
        echo "=== 必须关闭的包（防上游默认值坑）==="
        for neg in shadowsocks-rust-sslocal shadowsocks-rust-ssserver simple-obfs-client smartdns rust; do
          if grep -qx "CONFIG_PACKAGE_${neg}=y" .config; then
            echo "  BAD   仍被选中 ${neg}"; BMISS=1
          else
            echo "  OK    未选中 ${neg}"
          fi
        done

        # ---- 总量记录（仅参考，不做致命判据）----
        # 教训：凭直觉定阈值会造成误报。本配置实测 466 个
        # CONFIG_PACKAGE_*=y 属于正常（含大量 kmod-* 独立符号）。
        # 判断 ALL 是否被打开，用下面确定性的符号检查，不用计数。
        echo "=== 包总量（参考值，基准 466）==="
        PKGN=$(grep -c '^CONFIG_PACKAGE_[^=]*=y$' .config)
        echo "  CONFIG_PACKAGE_*=y 共 ${PKGN} 个"
        if grep -qE '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|BUILD_ALL_HOST_TOOLS)=y$' .config; then
          echo "  BAD   有 ALL 类开关被打开："
          grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|BUILD_ALL_HOST_TOOLS)=y$' .config
          BMISS=1
        else
          echo "  OK    ALL / ALL_KMODS / ALL_NONSHARED / BUILD_ALL_HOST_TOOLS 均未开启"
        fi

        if [ "$BMISS" = "1" ]; then
          echo "FATAL: 引导/镜像/优化/包选择不符合预期，中止"
          exit 1
        fi

        if [ "$MISS" = "1" ]; then
          echo "FATAL: defconfig 后有关键包被丢弃，中止下载以节省时间"
          exit 1
        fi

        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        grep -E '^CONFIG_LINUX_|KERNEL_PATCHVER' .config || true
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "--- artifacts ---"; ls -la bin/targets/x86/64/ | grep -E 'combined|rootfs|kernel' || true
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      # 关键：必须编译成功才往下走。
      # 原模板只判 !cancelled()，导致编译失败也会建 release，
      # 于是仓库里堆了 5 个 0 资产的空 release，其中一个还被标成 Latest。
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        # GoFile 未启用（UPLOAD_GOFILE 未定义），该行已注释，避免无意义的分支
        # [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "GoFile: ${{ steps.gofile.outputs.url }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
